name: Selenium Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:          # lets you trigger a run manually from the Actions tab
  schedule:
    - cron: '30 1 * * *'      # nightly at 07:00 IST

jobs:
  ui-tests:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false        # a Chrome failure should not cancel the Firefox run
      matrix:
        browser: [ chrome, firefox ]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven          # caches ~/.m2 so later runs skip the dependency download

      - name: Run the regression suite
        run: mvn -B clean test -Dbrowser=${{ matrix.browser }} -Dheadless=true

      - name: Upload the Extent report
        if: always()            # publish evidence even when tests fail — that is the point
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ matrix.browser }}
          path: target/extent-report/
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.browser }}
          path: target/screenshots/
          retention-days: 14

      - name: Upload Surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.browser }}
          path: target/surefire-reports/
          retention-days: 14
