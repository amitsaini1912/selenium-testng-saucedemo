# Application under test
base.url=https://www.saucedemo.com/

# Browser: chrome | firefox | edge  (override with -Dbrowser=firefox)
browser=chrome

# Headless: true in CI, false locally (override with -Dheadless=true)
headless=false

# Timeouts in seconds
explicit.wait=10
page.load.timeout=30

# Standard SauceDemo credentials
standard.user=standard_user
locked.user=locked_out_user
problem.user=problem_user
valid.password=secret_sauce
